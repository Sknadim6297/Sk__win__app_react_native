
services:
  - type: web
    name: sk-win-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://sk-win-web.onrender.com
      - key: SERVE_WEBSITE
        value: "false"
      - key: PAYMENT_ENABLED
        value: "false"
      - key: ZAPUPI_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false

  - type: web
    name: sk-win-web
    runtime: static
    plan: free
    region: singapore
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /downloads/*
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*
        name: Content-Disposition
        value: attachment; filename="WAREZONE-v1.0.2.apk"
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        value: https://sk-win-api.onrender.com
      - key: VITE_PWA_URL
        value: https://sk-win-pwa.onrender.com
      - key: VITE_IOS_TESTFLIGHT_URL
        sync: false
      - key: VITE_IOS_APP_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: sk-win-pwa
    runtime: static
    plan: free
    region: singapore
    buildCommand: npm install && node scripts/prepare-pwa-icons.js && npx expo export --platform web && node scripts/copy-pwa-public.js
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: EXPO_PUBLIC_API_URL
        value: https://sk-win-api.onrender.com/api
      - key: EXPO_PUBLIC_APP_NAME
        value: WAREZONE
      - key: EXPO_PUBLIC_PAYMENT_ENABLED
        value: "false"
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        value: 188535028372-q5ure3if58qkkrhgeimgrhoo5td7e9gs.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
        value: 188535028372-vgg0o270r97e3qtg21ilpt0m6dj1t37j.apps.googleusercontent.com
      - key: EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
        value: 188535028372-c7lhtl9ku9qufa0v4b163icqepmrrl8a.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html