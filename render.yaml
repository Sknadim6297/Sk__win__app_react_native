# Render Blueprint — WAREZONE (SK-Win)
# Dashboard: New → Blueprint → connect this GitHub repo
#
# Frontend (sk-win-web) serves the APK download landing page at `/`
# (not the Expo web app homepage). Expo web remains available locally via `npm run web`.
#
# After first deploy:
# 1. Set MONGODB_URI (MongoDB Atlas) on sk-win-api
# 2. Confirm PUBLIC_BASE_URL = your API URL (https://sk-win-api.onrender.com)
# 3. Optional on sk-win-web: APK_DOWNLOAD_URL if the APK is hosted elsewhere
# 4. Keep EXPO_PUBLIC_API_URL=https://sk-win-api.onrender.com/api (mobile/EAS builds)

services:
  - type: web
    name: sk-win-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_ENABLED
        value: "false"
      - key: CASHFREE_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: sk-win-web
    runtime: static
    plan: free
    region: singapore
    buildCommand: node scripts/build-render-frontend.js
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: EXPO_PUBLIC_API_URL
        value: https://sk-win-api.onrender.com/api
      - key: EXPO_PUBLIC_APP_NAME
        value: WAREZONE Tournament
      - key: EXPO_PUBLIC_PAYMENT_ENABLED
        value: "false"
      - key: APK_VERSION
        value: "1.0.0"
      - key: APK_FILE_NAME
        value: WAREZONE-v1.0.0.apk
      # Optional override. If unset, build copies public/downloads/<APK_FILE_NAME> into dist.
      - key: APK_DOWNLOAD_URL
        sync: false
      - key: CI
        value: "1"
