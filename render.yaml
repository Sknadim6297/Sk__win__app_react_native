# Render Blueprint — WAREZONE (SK-Win)
#
# sk-win-api  → Backend API + admin panel + APK downloads only
# sk-win-web  → Marketing website (React/Vite) — share THIS URL with players
#
# IMPORTANT: sk-win-api Root Directory must be the REPO ROOT (leave blank).

services:
  - type: web
    name: sk-win-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://sk-win-web.onrender.com
      - key: SERVE_WEBSITE
        value: "false"
      - key: PAYMENT_ENABLED
        value: "false"
      - key: ZAPUPI_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false

  - type: web
    name: sk-win-web
    runtime: static
    plan: free
    region: singapore
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /downloads/*
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*
        name: Content-Disposition
        value: attachment; filename="WAREZONE-v1.0.2.apk"
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        value: https://sk-win-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html