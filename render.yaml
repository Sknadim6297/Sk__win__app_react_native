# Render Blueprint — WAREZONE (SK-Win)
#
# Frontend (sk-win-web): WAREZONE marketing website + APK
#   Build:  npm install --prefix website && npm run website:build
#   Publish: website/dist
#
# Backend (sk-win-api): Node API + website + APK (repo root, so public/downloads is included)
#   Build:  npm install --prefix backend && npm install --prefix website && npm run website:build
#   Start:  node backend/server.js
#
# Custom domain: attach it to sk-win-web (site) and set VITE_API_URL to the API host.
# APK file: public/downloads/WAREZONE-v1.0.0.apk (~16 MB, tracked in git)

services:
  - type: web
    name: sk-win-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --prefix backend && npm install --prefix website && npm run website:build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_ENABLED
        value: "false"
      - key: CASHFREE_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false

  - type: web
    name: sk-win-web
    runtime: static
    plan: free
    region: singapore
    # Static WAREZONE website. APK is copied into website/dist/downloads during build.
    buildCommand: npm install --prefix website && npm run website:build
    staticPublishPath: website/dist
    headers:
      - path: /downloads/*
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*
        name: Content-Disposition
        value: attachment; filename="WAREZONE-v1.0.0.apk"
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_API_URL
        value: https://sk-win-api.onrender.com
      - key: EXPO_PUBLIC_API_URL
        value: https://sk-win-api.onrender.com/api
      - key: EXPO_PUBLIC_APP_NAME
        value: WAREZONE Tournament
      - key: EXPO_PUBLIC_PAYMENT_ENABLED
        value: "false"
      - key: APK_VERSION
        value: "1.0.0"
      - key: APK_FILE_NAME
        value: WAREZONE-v1.0.0.apk
      - key: APK_DOWNLOAD_URL
        value: /downloads/WAREZONE-v1.0.0.apk
      - key: CI
        value: "1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
