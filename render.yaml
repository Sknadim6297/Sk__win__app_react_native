# Render Blueprint — WAREZONE (SK-Win)
#
# Frontend (sk-win-web): static APK download landing at `/`
#   Build:  node scripts/build-render-frontend.js
#   Publish: dist/
#   No start command (Static Site / CDN)
#
# Backend (sk-win-api): Node API only — NOT the download page
#   Build:  npm install
#   Start:  npm start
#
# Architecture:
#   Browser  → https://sk-win-app-react-native-65a3.onrender.com  (download page)
#   Android  → https://sk-win-api.onrender.com/api                (API)
#
# APK must exist at: public/downloads/WAREZONE-v1.0.0.apk
# (build fails if missing so production never shows a broken download button)

services:
  - type: web
    name: sk-win-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PAYMENT_ENABLED
        value: "false"
      - key: CASHFREE_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: sk-win-web
    runtime: static
    plan: free
    region: singapore
    # Static site — no startCommand. Serves files from dist/ after build.
    buildCommand: node scripts/build-render-frontend.js
    staticPublishPath: dist
    # No SPA catch-all rewrite: /downloads/*.apk must be served as binary files.
    # Render serves existing files as-is; index.html is used for /.
    headers:
      - path: /downloads/*
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*
        name: Content-Disposition
        value: attachment; filename="WAREZONE-v1.0.0.apk"
      - path: /downloads/*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: EXPO_PUBLIC_API_URL
        value: https://sk-win-api.onrender.com/api
      - key: EXPO_PUBLIC_APP_NAME
        value: WAREZONE Tournament
      - key: EXPO_PUBLIC_PAYMENT_ENABLED
        value: "false"
      - key: APK_VERSION
        value: "1.0.0"
      - key: APK_FILE_NAME
        value: WAREZONE-v1.0.0.apk
      # Prefer API host — sets Content-Disposition so Android 12 Chrome saves a real .apk
      - key: APK_DOWNLOAD_URL
        value: https://sk-win-api.onrender.com/downloads/WAREZONE-v1.0.0.apk
      - key: CI
        value: "1"
